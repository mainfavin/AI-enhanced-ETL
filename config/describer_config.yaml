
media_path: "media/videos/video_cosmos1.mp4" # "media/audios/audio_test_20s.mp3"
base_url: "http://localhost:11434/"

prompt_video: "Estas imagenes forman parte de video, describe en base a lo que esta sucediendo en cada una de ellas lo que esta pasando en el video."
prompt_imagen: "Por favor describeme que esta pasando en estas imagenes y luego comparamelas." 
prompt_audio: "Eres un experto en análisis de contenido auditivo. Describe el contenido de esta transcripción:"
